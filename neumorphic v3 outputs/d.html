<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brevity — AI Writing Tool for Marketing Teams</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
:root{--bg:#e6e9ef;--bg-mid:#d1d5db;--shadow-dark:#b8bcc2;--shadow-light:#ffffff;--accent:#7c3aed;--accent-dark:#6d28d9;--accent-rgb:124,58,237;--text-primary:#1f2937;--text-muted:#6b7280}
body{background:var(--bg);color:var(--text-primary);font-family:'Inter',system-ui,sans-serif}
.neu-raised{background:linear-gradient(145deg,var(--bg),var(--bg-mid));box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light)}
.neu-raised-sm{background:linear-gradient(145deg,var(--bg),var(--bg-mid));box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light)}
.neu-convex{box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light),inset 1px 1px 2px rgba(255,255,255,0.4),inset -1px -1px 2px rgba(0,0,0,0.15)}
.neu-inset{background:linear-gradient(145deg,var(--bg-mid),var(--bg));box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light)}
.neu-card{background:linear-gradient(145deg,var(--bg),var(--bg-mid));box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);border-radius:30px;padding:32px;transition:all 0.3s ease}
.neu-card:hover{transform:translateY(-4px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light),inset 1px 1px 2px rgba(255,255,255,0.4),inset -1px -1px 2px rgba(0,0,0,0.15);border-radius:16px;padding:16px 40px;color:white;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px;transition:all 0.15s ease}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(var(--accent-rgb),0.3)}
.btn-primary:active{transform:translateY(1px);box-shadow:inset 4px 4px 8px rgba(0,0,0,0.2)}
.btn-secondary{background:linear-gradient(145deg,var(--bg),var(--bg-mid));box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);border-radius:16px;padding:16px 40px;color:var(--text-primary);border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px;transition:all 0.15s ease}
.btn-secondary:hover{transform:translateY(-2px)}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.marquee-track{display:flex;gap:32px;animation:marquee 20s linear infinite;width:max-content}
.marquee-wrap{overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,black 10%,black 90%,transparent);mask-image:linear-gradient(to right,transparent,black 10%,black 90%,transparent)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.animate-float{animation:float 3s ease-in-out infinite}
#navbar{position:fixed;top:0;left:0;right:0;z-index:999;transition:all 0.3s ease;padding:1.5rem 0}
#navbar.scrolled{padding:0.75rem 0;background:rgba(230,233,239,0.85);backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.faq-answer{max-height:0;overflow:hidden;transition:max-height 0.3s ease}
.faq-item.active .faq-answer{max-height:200px}
.faq-icon{transition:transform 0.3s ease}
.faq-item.active .faq-icon{transform:rotate(45deg)}
</style>
</head>
